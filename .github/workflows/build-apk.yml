# Auto-build APK:
# - push ke main            -> flutter pub get, analyze, test, build DEBUG apk
#                              sebagai validasi kompilasi saja. TIDAK upload
#                              ke mana pun (tanpa artifact, tanpa release).
# - push tag v* (mis. v1.0.0) -> pub get, analyze, test, restore upload
#                              keystore dari Secrets, build RELEASE apk
#                              (signed keystore permanen), buat GitHub Release
#                              + attach app-release.apk. Satu-satunya upload.
# - workflow_dispatch       -> bisa dijalankan manual; perilakunya mengikuti
#                              ref yang dipilih (branch -> jalur debug,
#                              tag -> jalur release).
#
# .env TIDAK di-commit (gitignored) — dibuat saat build dari Secrets.
# Wajib isi di repo Settings > Secrets > Actions:
#   SUPABASE_URL, SUPABASE_ANON_KEY, R2_ENDPOINT,
#   R2_ACCESS_KEY, R2_SECRET_KEY, R2_BUCKET,
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS
name: build-apk

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.3'
          cache: true

      - name: Generate .env from secrets
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          R2_ENDPOINT=${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY=${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY=${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET=${{ secrets.R2_BUCKET }}
          EOF

      - run: flutter pub get
      - run: flutter analyze
      # Hapus baris ini kalau test terlalu lama di CI:
      - run: flutter test

      # Upload keystore permanen: release APK HARUS signed dengan key yang
      # sama tiap build, kalau tidak Android menolak install update.
      # Gagal cepat di sini (bukan 3 menit kemudian di Gradle) kalau
      # secrets kosong/rusak.
      - name: Restore upload keystore
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ] \
             || [ -z "$KEY_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::One or more ANDROID_KEYSTORE_* secrets are empty. Fill them in repo Settings > Secrets > Actions."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          # Pastikan file hasil decode benar-benar keystore valid.
          keytool -list -keystore android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASS" -alias "$KEY_ALIAS" > /dev/null

      - name: Build debug APK (branch push)
        if: startsWith(github.ref, 'refs/heads/')
        run: flutter build apk --debug

      - name: Build release APK (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        run: flutter build apk --release

      # Audit trail signing: pastikan APK ter-sign dengan benar dan catat
      # fingerprint sertifikat di log (bandingkan antar rilis).
      - name: Verify release signature (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "Signer #1|SHA-256"

      # Idempoten: kalau release untuk tag ini sudah ada (mis. dibuat
      # manual), upload/overwrite APK-nya; kalau belum, buat release baru.
      # `gh release create` murni akan gagal "already exists" pada kasus itu.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "$TAG" \
              --notes "Auto build ourspace $TAG"
          fi
